server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml image/png;

  # --- Proxy de mismo origen para la demo (sortea CORS sin servicio aparte) ---
  # La demo (Pyodide) pide {origen}/datosabiertos/... (BOE) y {origen}/legal-content/...
  # (EUR-Lex). Como el XHR no manda Accept, se fija aqui segun la ruta, igual que
  # hacia el worker. Solo se reenvian rutas de fuentes oficiales.

  # BOE: endpoint de bloque (articulado) -> exige XML.
  location ~* ^/datosabiertos/.*/texto/bloque/ {
    proxy_pass https://www.boe.es;
    proxy_set_header Host www.boe.es;
    proxy_ssl_server_name on;
    proxy_set_header Accept "application/xml";
    proxy_set_header User-Agent "legal-expand-proxy";
    proxy_set_header Accept-Encoding "";
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=86400" always;
  }

  # BOE: resto del API de legislacion consolidada (indices, metadatos) -> JSON.
  location /datosabiertos/ {
    proxy_pass https://www.boe.es;
    proxy_set_header Host www.boe.es;
    proxy_ssl_server_name on;
    proxy_set_header Accept "application/json, application/xml;q=0.9";
    proxy_set_header User-Agent "legal-expand-proxy";
    proxy_set_header Accept-Encoding "";
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=86400" always;
  }

  # EUR-Lex: documento HTML consolidado por CELEX.
  location /legal-content/ {
    proxy_pass https://eur-lex.europa.eu;
    proxy_set_header Host eur-lex.europa.eu;
    proxy_ssl_server_name on;
    proxy_set_header Accept "text/html";
    proxy_set_header User-Agent "legal-expand-proxy";
    proxy_set_header Accept-Encoding "";
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=86400" always;
  }

  # --- Sitio estatico ---
  location / {
    try_files $uri $uri/ /index.html;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
}
